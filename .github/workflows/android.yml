            catch(er){toast('تعذّر قراءة الملف. المدعوم: PNG وJPG وWEBP وGIF وBMP وAVIF وSVG وPDF')}
          };
          $('#ncrm').onclick=()=>{if(nci&&nci!==nci0)idbDel(nci);nci=null;ciUpd()};
          $('#ncti').onchange=csRender;

          /* ===== أدوات الدراسة (بدون إنترنت) ===== */
          function STD(){return{pom:{f:25,b:5,log:{}},cards:[],tasks:[],tt:[]}}
          const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
          const dnum=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
          const TOOLS=[['pom','timer','مؤقت التركيز'],['fc','cards','بطاقات المراجعة'],['tk','cal','الواجبات والاختبارات'],['tt','table','الجدول الأسبوعي']];
          function renderTools(){const g=$('#tools');if(!g||g.dataset.r)return;g.dataset.r=1;TOOLS.forEach(([k,i,l])=>{const b=document.createElement('button');b.className='tile';b.innerHTML=ic(i)+'<span>'+l+'</span>';b.onclick=()=>svOpen(k,l);g.append(b)})}
          let sv='';
          const svb=()=>$('#svb'),q$=s=>svb().querySelector(s);
          function svOpen(k,t){sv=k;$('#svt').textContent=t;$('#sv').hidden=false;({pom:svPom,fc:svCards,tk:svTasks,tt:svTt})[k]()}
          $('#svx').onclick=()=>{$('#sv').hidden=true;sv=''};
          const clampN=(v,a,b,d)=>{v=Math.round(+v);return isNaN(v)?d:Math.max(a,Math.min(b,v))};

          /* 1) مؤقت التركيز */
          const pm={mode:'f',left:0,run:false,end:0,iv:0};
          const pmFmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
          function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.2;o.start();setTimeout(()=>{o.stop();a.close()},700)}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
          function pmDraw(){const e=$('#pmt');if(!e||sv!=='pom')return;const p=S.st.pom,tot=(pm.mode==='f'?p.f:p.b)*60;e.textContent=pmFmt(pm.left);$('#pmb').style.width=(100-pm.left/tot*100)+'%'}
          function pmTick(){
            if(!pm.run)return;pm.left=Math.max(0,Math.round((pm.end-Date.now())/1000));
            if(pm.left<=0){pm.run=false;clearInterval(pm.iv);const p=S.st.pom;
              if(pm.mode==='f'){const k=dk(new Date());p.log[k]=(p.log[k]||0)+p.f;saveMeta()}
              beep();toast(pm.mode==='f'?'انتهى وقت التركيز! خذ استراحة':'انتهت الاستراحة، هيا نكمل');
              pm.mode=pm.mode==='f'?'b':'f';pm.left=(pm.mode==='f'?p.f:p.b)*60;if(sv==='pom')svPom();return}
            pmDraw();
          }
          function svPom(){
            const p=S.st.pom;if(!pm.run&&!pm.left)pm.left=(pm.mode==='f'?p.f:p.b)*60;
            const days=[];for(let d=6;d>=0;d--){const t=new Date();t.setDate(t.getDate()-d);days.push([['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'][t.getDay()],p.log[dk(t)]||0])}
            const mx=Math.max(30,...days.map(d=>d[1])),today=days[6][1],wk=days.reduce((a,d)=>a+d[1],0);
            svb().innerHTML='<div class="lb" style="text-align:center">'+(pm.mode==='f'?'وقت التركيز':'استراحة')+'</div><div id="pmt" class="bigt"></div><div class="bar"><i id="pmb"></i></div>'+
            '<div class="row" style="justify-content:center"><button id="pms" class="on" style="padding:10px 22px">'+(pm.run?'إيقاف مؤقت':'ابدأ')+'</button><button id="pmr">إعادة</button><button id="pmm">'+(pm.mode==='f'?'انتقل للاستراحة':'انتقل للتركيز')+'</button></div>'+
            '<div class="mrow"><div class="mc"><div class="lb">دقائق التركيز</div><input id="pmf" class="fld" type="number" min="1" max="180" value="'+p.f+'"></div><div class="mc"><div class="lb">دقائق الاستراحة</div><input id="pmb2" class="fld" type="number" min="1" max="60" value="'+p.b+'"></div></div>'+
            '<div class="lb">اليوم: '+today+' دقيقة · آخر 7 أيام: '+wk+' دقيقة</div><div class="dbars">'+days.map(d=>'<div><i style="height:'+Math.max(2,d[1]/mx*70)+'px"></i>'+d[0]+'</div>').join('')+'</div>';
            pmDraw();
            $('#pms').onclick=()=>{if(pm.run){pm.run=false;clearInterval(pm.iv)}else{pm.run=true;pm.end=Date.now()+pm.left*1000;clearInterval(pm.iv);pm.iv=setInterval(pmTick,500)}svPom()};
            $('#pmr').onclick=()=>{pm.run=false;clearInterval(pm.iv);pm.left=(pm.mode==='f'?p.f:p.b)*60;svPom()};
            $('#pmm').onclick=()=>{pm.run=false;clearInterval(pm.iv);pm.mode=pm.mode==='f'?'b':'f';pm.left=(pm.mode==='f'?p.f:p.b)*60;svPom()};
            $('#pmf').onchange=e=>{p.f=clampN(e.target.value,1,180,25);saveMeta();if(!pm.run&&pm.mode==='f')pm.left=p.f*60;svPom()};
            $('#pmb2').onchange=e=>{p.b=clampN(e.target.value,1,60,5);saveMeta();if(!pm.run&&pm.mode==='b')pm.left=p.b*60;svPom()};
          }

          /* 2) بطاقات المراجعة (تكرار متباعد) */
          const fc={q:[],c:null,show:false};
          function fcGrade(c,g){
            const t=dnum();
            if(g===0){c.reps=0;c.iv=0;c.ef=Math.max(1.3,(c.ef||2.5)-.2);c.due=t;fc.q.push(c)}
            else{c.ef=Math.max(1.3,(c.ef||2.5)+(g===1?-.15:g===3?.15:0));
              c.iv=g===1?Math.max(1,Math.round((c.iv||1)*1.2)):c.reps===0?(g===3?3:1):c.reps===1?(g===3?6:3):Math.round(c.iv*c.ef*(g===3?1.3:1));
              c.reps++;c.due=t+c.iv}
            saveMeta();
          }
          function svCards(v){
            const cs=S.st.cards,t=dnum(),due=cs.filter(c=>c.due<=t),decks=[...new Set(cs.map(c=>c.deck))];
            if(v==='rev'){
              if(!fc.c){fc.c=fc.q.shift()||null;fc.show=false}
              if(!fc.c){svb().innerHTML='<div class="empty">'+ic('check')+'<div>أحسنت! انتهت مراجعة اليوم</div></div><button id="fcb">رجوع</button>';$('#fcb').onclick=()=>svCards();return}
              svb().innerHTML='<div class="lb">المتبقي: '+(fc.q.length+1)+' · '+esc(fc.c.deck)+'</div><button id="fcs" class="fcard">'+esc(fc.show?fc.c.b:fc.c.f)+'</button>'+
              (fc.show?'<div class="gr4"><button data-g="0">لم أعرف</button><button data-g="1">صعب</button><button data-g="2">جيد</button><button data-g="3">سهل</button></div>':'<div class="lb" style="text-align:center">المس البطاقة لإظهار الجواب</div>')+'<button id="fcb">إنهاء</button>';
              $('#fcs').onclick=()=>{fc.show=!fc.show;svCards('rev')};$('#fcb').onclick=()=>{fc.c=null;svCards()};
              svb().querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{fcGrade(fc.c,+b.dataset.g);fc.c=fc.q.shift()||null;fc.show=false;svCards('rev')});return;
            }
            if(v==='add'){
              svb().innerHTML='<input id="fcd" class="fld" list="fcl" placeholder="المادة / المجموعة" value="'+esc(decks[0]||'')+'"><datalist id="fcl">'+decks.map(d=>'<option value="'+esc(d)+'">').join('')+'</datalist>'+
              '<textarea id="fcf" class="fld" rows="3" placeholder="السؤال / المصطلح"></textarea><textarea id="fcz" class="fld" rows="3" placeholder="الجواب / التعريف"></textarea><div class="row"><button id="fcb">رجوع</button><button id="fcv" class="on">حفظ البطاقة</button></div>';
              $('#fcb').onclick=()=>svCards();
              $('#fcv').onclick=()=>{const d=$('#fcd').value.trim()||'عام',f=$('#fcf').value.trim(),b=$('#fcz').value.trim();if(!f||!b){toast('اكتب السؤال والجواب');return}
                cs.push({id:uid(),deck:d,f,b,ef:2.5,iv:0,reps:0,due:dnum()});saveMeta();$('#fcf').value='';$('#fcz').value='';toast('تمت الإضافة ('+cs.length+')');$('#fcf').focus()};return;
            }
            if(v==='list'){
              svb().innerHTML='<button id="fcb">رجوع</button>'+(cs.length?cs.map(c=>'<div class="it"><div style="flex:1"><b>'+esc(c.f)+'</b><small>'+esc(c.deck)+' · '+(c.due<=t?'مستحقة':'بعد '+(c.due-t)+' يوم')+'</small></div><button class="ib" data-x="'+c.id+'" aria-label="حذف">'+ic('trash')+'</button></div>').join(''):'<div class="empty">لا توجد بطاقات</div>');
              $('#fcb').onclick=()=>svCards();
              svb().querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{S.st.cards=S.st.cards.filter(c=>c.id!==b.dataset.x);saveMeta();svCards('list')});return;
            }
            svb().innerHTML='<div class="mrow"><div class="mc"><div class="bigt" style="font-size:40px">'+due.length+'</div><div class="lb">بطاقة مستحقة اليوم من '+cs.length+'</div></div></div>'+
            '<button id="fcr" class="on" style="padding:12px"'+(due.length?'':' disabled')+'>ابدأ المراجعة</button><button id="fca">إضافة بطاقة</button><button id="fcl2">كل البطاقات</button>'+
            (decks.length?'<div class="lb">المجموعات</div>'+decks.map(d=>'<div class="it"><b style="flex:1">'+esc(d)+'</b><span class="pill" style="background:#2f6bff">'+cs.filter(c=>c.deck===d).length+'</span></div>').join(''):'<div class="lb">أضف بطاقاتك الأولى. تُجدول المراجعة تلقائيًا بالتكرار المتباعد: ما تعرفه يتباعد، وما تنساه يعود قريبًا.</div>');
            $('#fcr').onclick=()=>{fc.q=due.slice().sort(()=>Math.random()-.5);fc.c=null;fc.show=false;svCards('rev')};$('#fca').onclick=()=>svCards('add');$('#fcl2').onclick=()=>svCards('list');
          }

          /* 3) الواجبات والاختبارات */
          function svTasks(){
            const td=new Date(new Date().toDateString()),L=S.st.tasks.slice().sort((a,b)=>(!!a.done-!!b.done)||a.d.localeCompare(b.d));
            const row=t=>{const n=Math.round((new Date(t.d+'T00:00:00')-td)/864e5),lab=n<0?'متأخر '+(-n)+' يوم':n===0?'اليوم':n===1?'غدًا':'بعد '+n+' يوم',col=t.done?'#8a93a6':n<0?'#e5484d':n<=2?'#f08c00':'#2f9e44';
              return '<div class="it"><input type="checkbox" data-c="'+t.id+'" '+(t.done?'checked':'')+' aria-label="تم"><div style="flex:1;'+(t.done?'text-decoration:line-through;opacity:.55':'')+'"><b>'+esc(t.t)+'</b><small>'+esc(t.k)+' · '+t.d+'</small></div><span class="pill" style="background:'+col+'">'+(t.done?'منجز':lab)+'</span><button class="ib" data-x="'+t.id+'" aria-label="حذف">'+ic('trash')+'</button></div>'};
            svb().innerHTML='<input id="tkt" class="fld" placeholder="العنوان (مثال: اختبار الكيمياء النصفي)"><div class="mrow"><input id="tkd" class="fld" type="date" value="'+dk(new Date())+'"><select id="tkk" class="fld"><option>اختبار</option><option>واجب</option><option>مشروع</option><option>عرض تقديمي</option></select></div><button id="tka" class="on">إضافة</button>'+(L.length?L.map(row).join(''):'<div class="empty">لا توجد مهام</div>');
            $('#tka').onclick=()=>{const t=$('#tkt').value.trim(),d=$('#tkd').value;if(!t||!d){toast('اكتب العنوان واختر التاريخ');return}S.st.tasks.push({id:uid(),t,d,k:$('#tkk').value,done:false});saveMeta();svTasks()};
            svb().querySelectorAll('[data-c]').forEach(b=>b.onchange=()=>{const t=S.st.tasks.find(x=>x.id===b.dataset.c);if(t){t.done=b.checked;saveMeta();svTasks()}});
            svb().querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{S.st.tasks=S.st.tasks.filter(x=>x.id!==b.dataset.x);saveMeta();svTasks()});
          }

          /* 5) الجدول الأسبوعي للمحاضرات */
          const DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
          function svTt(){
            const L=S.st.tt,now=new Date(),di=(now.getDay()+1)%7,nm=now.getHours()*60+now.getMinutes(),tm=s=>{const a=s.split(':');return +a[0]*60+ +a[1]};
            let nx=null,best=1e9;L.forEach(t=>{let d=(t.day-di+7)%7;const m=tm(t.s)-nm;if(d===0&&m<0)d=7;const v=d*1440+m;if(v<best){best=v;nx=t}});
            const nl=nx?'المحاضرة القادمة: <b>'+esc(nx.n)+'</b> — '+DAYS[nx.day]+' '+nx.s+' (بعد '+(best>=1440?Math.floor(best/1440)+' يوم ':'')+(Math.floor(best%1440/60)?Math.floor(best%1440/60)+' س ':'')+(best%60)+' د)':'';
            svb().innerHTML=(nl?'<div class="it" style="display:block">'+nl+'</div>':'')+
            '<div class="mrow"><select id="ttd" class="fld">'+DAYS.map((d,i)=>'<option value="'+i+'"'+(i===di?' selected':'')+'>'+d+'</option>').join('')+'</select><input id="tts" class="fld" type="time" value="08:00"><input id="tte" class="fld" type="time" value="09:30"></div>'+
            '<div class="mrow"><input id="ttn" class="fld" placeholder="المادة"><input id="ttr" class="fld" placeholder="القاعة"></div><button id="tta" class="on">إضافة محاضرة</button>'+
            DAYS.map((d,i)=>{const a=L.filter(t=>t.day===i).sort((x,y)=>x.s.localeCompare(y.s));return a.length?'<div class="lb"'+(i===di?' style="color:var(--ac)"':'')+'>'+d+(i===di?' (اليوم)':'')+'</div>'+a.map(t=>'<div class="it"><div style="flex:1"><b>'+esc(t.n)+'</b><small>'+t.s+' - '+t.e+(t.r?' · '+esc(t.r):'')+'</small></div><button class="ib" data-x="'+t.id+'" aria-label="حذف">'+ic('trash')+'</button></div>').join(''):''}).join('');
            $('#tta').onclick=()=>{const n=$('#ttn').value.trim(),s=$('#tts').value,e=$('#tte').value;if(!n||!s||!e){toast('اكتب المادة وحدّد الوقت');return}if(e<=s){toast('وقت النهاية يجب أن يكون بعد البداية');return}L.push({id:uid(),day:+$('#ttd').value,s,e,n,r:$('#ttr').value.trim()});saveMeta();svTt()};
            svb().querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{S.st.tt=S.st.tt.filter(x=>x.id!==b.dataset.x);saveMeta();svTt()});
          }

          const SC=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Shortcut;
          $('#npin').onclick=async()=>{
            const p=SC();if(!p){toast('الاختصار متاح في تطبيق الأندرويد فقط');return}
            try{await p.pin({id:cur.id,title:$('#nt').value.trim()||cur.title,color:ncv});toast('أكّد الإضافة في نافذة النظام')}
            catch(e){toast('هاتفك لا يدعم اختصارات الشاشة الرئيسية')}
          };
          function openById(id){
            if(!S.notes.some(n=>n.id===id)){toast('هذه الملاحظة لم تعد موجودة');return}
            deselect();$('#nd').hidden=true;$('#pp').hidden=true;openNote(id);setTool('pen');
          }
          window.addEventListener('najmaOpen',e=>e.id&&ready.then(()=>openById(e.id)));
          const ready=initStore().then(home);
          {const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
          const goBack=()=>{
            const o=['#sv','#gp','#im','#nd'].map(x=>$(x)).find(x=>x&&!x.hidden);
            if(o){o.hidden=true;return}
            if(!$('#pp').hidden){$('#pp').hidden=true;return}
            if(cur){deselect();save();flush();home();return}
            if(A&&A.exitApp)A.exitApp();
          };
          if(A&&A.addListener)A.addListener('backButton',goBack);}
          {const p=SC();if(p)p.getLaunch().then(r=>r&&r.id&&ready.then(()=>openById(r.id))).catch(()=>{})}
          $('#pages').addEventListener('scroll',()=>{rq();if(cur&&cv.length){const p=curPage();if(p!==ap){ap=p;pnUpd();actv()}}});window.addEventListener('resize',rq);window.addEventListener('resize',reveal);if(window.visualViewport)visualViewport.addEventListener('resize',reveal);
          </script>
          </body>
          </html>
          NAJMA_EOF

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6
          npx cap init "نجمة" com.najma.notes --web-dir=www
          npx cap add android
          npm install pdfjs-dist@3.11.174 --omit=optional
          mkdir -p www/pdfjs
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/pdfjs/
          npx cap sync android

      - name: Add home-screen shortcut plugin
        run: |
          D=android/app/src/main/java/com/najma/notes
          mkdir -p "$D"
          cat > "$D/ShortcutPlugin.java" <<'JAVA_EOF'
          package com.najma.notes;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ShortcutInfo;
          import android.content.pm.ShortcutManager;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.drawable.Icon;
          import android.os.Build;
          import android.text.Layout;
          import android.text.StaticLayout;
          import android.text.TextPaint;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Shortcut")
          public class ShortcutPlugin extends Plugin {
            @PluginMethod
            public void pin(PluginCall call) {
              String id = call.getString("id", "");
              String title = call.getString("title", "Note").trim();
              if (title.isEmpty()) title = "Note";
              int color;
              try { color = Color.parseColor(call.getString("color", "#3b5bdb")); } catch (Exception e) { color = Color.parseColor("#3b5bdb"); }
              if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) { call.reject("unsupported"); return; }
              Context c = getContext();
              ShortcutManager m = c.getSystemService(ShortcutManager.class);
              if (m == null || !m.isRequestPinShortcutSupported()) { call.reject("unsupported"); return; }
              Intent i = new Intent(c, MainActivity.class);
              i.setAction(Intent.ACTION_VIEW);
              i.putExtra("najmaNote", id);
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
              Bitmap b = Bitmap.createBitmap(192, 192, Bitmap.Config.ARGB_8888);
              Canvas cv = new Canvas(b);
              Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              p.setColor(color);
              cv.drawRoundRect(new RectF(0, 0, 192, 192), 44, 44, p);
              TextPaint tp = new TextPaint(Paint.ANTI_ALIAS_FLAG);
              tp.setColor(Color.WHITE);
              tp.setFakeBoldText(true);
              StaticLayout sl = null;
              for (float sz = 60; sz >= 16; sz -= 4) {
                tp.setTextSize(sz);
                sl = StaticLayout.Builder.obtain(title, 0, title.length(), tp, 160)
                  .setAlignment(Layout.Alignment.ALIGN_CENTER).build();
                if (sl.getHeight() <= 164) break;
              }
              cv.save();
              cv.translate(16, (192 - sl.getHeight()) / 2f);
              sl.draw(cv);
              cv.restore();
              ShortcutInfo s = new ShortcutInfo.Builder(c, "note-" + id)
                .setShortLabel(title).setLongLabel(title)
                .setIcon(Icon.createWithBitmap(b)).setIntent(i).build();
              m.requestPinShortcut(s, null);
              call.resolve();
            }

            @PluginMethod
            public void getLaunch(PluginCall call) {
              Intent i = getActivity().getIntent();
              JSObject r = new JSObject();
              String id = i == null ? null : i.getStringExtra("najmaNote");
              if (id != null) { r.put("id", id); i.removeExtra("najmaNote"); }
              call.resolve(r);
            }
          }
          JAVA_EOF
          cat > "$D/MainActivity.java" <<'JAVA_EOF'
          package com.najma.notes;

          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(ShortcutPlugin.class);
              super.onCreate(savedInstanceState);
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
              String id = intent.getStringExtra("najmaNote");
              if (id != null) {
                intent.removeExtra("najmaNote");
                getBridge().triggerWindowJSEvent("najmaOpen", "{\"id\":\"" + id + "\"}");
              }
            }
          }
          JAVA_EOF

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: najma-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Najma v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
