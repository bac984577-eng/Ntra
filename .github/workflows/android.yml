name: Build Daftar Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK (use runner SDK; no Gradle cache scan)
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/12.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/12.0/bin/sdkmanager"
          else
            echo "Android sdkmanager not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -path '*/bin/sdkmanager' -type f -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "PATH=$SDK_ROOT/platform-tools:$PATH" >> "$GITHUB_PATH"

      - name: Install Gradle without scanning project cache files
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION=8.7
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle --version

      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/daftar/notes app/src/main/res/values app/src/main/assets/tessdata

          # (Optional) sample tessdata download removed to speed build; restore if needed:
          # curl --fail --location --retry 3 "https://github.com/tesseract-ocr/tessdata_best/raw/main/ara.traineddata" -o app/src/main/assets/tessdata/ara.traineddata

          cat > settings.gradle.kts <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Daftar"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          echo 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official' > gradle.properties

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.daftar.notes"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.daftar.notes"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              // Removed native tess-two dependency to keep CI simple and avoid NDK/CMake issues.
              // Add dependencies here if needed.
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true" android:label="دفتر" android:theme="@style/AppTheme" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:statusBarColor">#F5F6FA</item>
                  <item name="android:navigationBarColor">#F5F6FA</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          # Write a minimal MainActivity that compiles (replace with your full Activity later)
          cat > app/src/main/java/com/daftar/notes/MainActivity.kt <<'EOF'
          package com.daftar.notes

          import android.os.Bundle
          import android.view.Gravity
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this).apply {
                      text = "دفتر — Daftar (Minimal build)"
                      gravity = Gravity.CENTER
                      textSize = 20f
                  }
                  setContentView(tv)
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          # Use the downloaded gradle binary on PATH (/tmp/gradle-... was added to PATH earlier)
          gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daftar-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
