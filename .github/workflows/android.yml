            if(C&&C.Filesystem&&C.Share){
              const fn='najma-'+Date.now()+'.pdf',CH=3*256*1024,u8=new Uint8Array(await blob.arrayBuffer());
              let w=null;
              for(let o=0;o<u8.length;o+=CH){
                let s='';const e=Math.min(u8.length,o+CH);
                for(let i=o;i<e;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,Math.min(e,i+8192)));
                const data=btoa(s);
                if(!o)w=await C.Filesystem.writeFile({path:fn,data,directory:'CACHE'});
                else await C.Filesystem.appendFile({path:fn,data,directory:'CACHE'});
              }
              await C.Share.share({title:name,files:[w.uri],dialogTitle:'حفظ أو مشاركة الملف'});return;
            }
            const dl=window.claude&&await window.claude.use('downloads').catch(()=>null);
            if(dl){await dl.save({filename:name,data:blob});return}
            const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
          }
