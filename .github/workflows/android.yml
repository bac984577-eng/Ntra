name: StarNote Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Fix npm cache
        run: |
          npm cache clean --force
          npm cache verify

      - name: Install dependencies with retry
        run: |
          npm install --legacy-peer-deps || npm install --legacy-peer-deps || npm install

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_BASE: https://api.starnote.app
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production
        run: |
          npm run build || npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: 26.0.10792818

      - name: Install Capacitor globally
        run: npm install -g @capacitor/cli --force

      - name: Install Capacitor deps
        run: npm install @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps

