                const data=btoa(s);
                if(!o)w=await C.Filesystem.writeFile({path:fn,data,directory:'CACHE'});
                else await C.Filesystem.appendFile({path:fn,data,directory:'CACHE'});
              }
              await C.Share.share({title:name,files:[w.uri],dialogTitle:'حفظ أو مشاركة الملف'});return;
            }
