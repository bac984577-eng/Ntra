              vx.beginPath();vx.moveTo(0,Tp);vx.lineTo(20,Tp);vx.moveTo(0,B);vx.lineTo(20,B);vx.stroke();
              hx.fillStyle=vx.fillStyle='#1f2430';hx.font=vx.font='bold 9px system-ui';
              hx.textAlign='right';hx.fillText(((L-ox)/k).toFixed(1),L-3,9);hx.textAlign='left';hx.fillText(((R-ox)/k).toFixed(1),R+3,9);
              vx.textAlign='center';vx.fillText(((Tp-oy)/k).toFixed(1),10,Tp-3);vx.fillText(((B-oy)/k).toFixed(1),10,B+10);
            }
          }
          function applyZoom(){document.querySelectorAll('.pw').forEach(w=>w.style.width=794*Z+'px');$('#zl').textContent=Math.round(Z*100)+'%';if(sel)place();rq()}
          $('#zi').onclick=()=>{Z=Math.min(3,Z+.1);applyZoom()};$('#zo').onclick=()=>{Z=Math.max(.3,Z-.1);applyZoom()};

          $('#un').onclick=()=>{deselect();swap(undo,redo)};$('#re').onclick=()=>{deselect();swap(redo,undo)};
          $('#ttl').oninput=e=>{cur.title=e.target.value||'دفتر بلا عنوان';save()};
          $('#back').onclick=()=>{deselect();save();home()};
          $('#sq').oninput=()=>home();
          $('#addp').onclick=addPage;
          $('#cov').onclick=()=>noteDlg('edit');$('#fab').onclick=()=>noteDlg('new');$('#exp').onclick=exportPdf;
          $('#ndel').onclick=()=>{
            const d=$('#ndel');
            if(!d.classList.contains('warn')){d.classList.add('warn');toast('اضغط مرة أخرى لتأكيد حذف الدفتر');setTimeout(()=>d.classList.remove('warn'),3000);return}
            const n=cur;cur=null;S.notes=S.notes.filter(x=>x!==n);dirty.delete(n);gone.push(n.id);save();n.pages.forEach(p=>p.bg&&gcBg(p.bg));$('#nd').hidden=true;home();

          };
          const uid=()=>Math.random().toString(36).slice(2,9);
          let _db=null;
          const idb=()=>_db||(_db=new Promise((ok,no)=>{try{const r=indexedDB.open('najma-bg',2);r.onupgradeneeded=()=>{const d=r.result;['bg','kv'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}));
          const idbPut=async(k,v)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('bg','readwrite');t.objectStore('bg').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})};
          const idbGet=async k=>{try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('bg').objectStore('bg').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch(e){return null}};
          const gcBg=async id=>{if(S.notes.some(n=>n.pages.some(p=>p.bg===id)))return;try{const d=await idb(),o=d.transaction('bg','readwrite').objectStore('bg');o.delete(id);o.delete(id+':t')}catch(e){}};
          const BG=new Map(),TH=new Map();
          function thFor(id){
            let e=TH.get(id);if(!e){e=new Image();TH.set(id,e);e.onload=()=>{clearTimeout(thFor.t);thFor.t=setTimeout(strip,120)};idbGet(id+':t').then(d=>{if(d)e.src=d})}
            return e.complete&&e.naturalWidth?e:null;
          }
          function thumbData(src,w,h){
            const c=document.createElement('canvas');c.width=108;c.height=152;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,108,152);
            const sw=src.naturalWidth||src.width,sh=src.naturalHeight||src.height,k=Math.min(108/sw,152/sh);
            x.drawImage(src,(108-sw*k)/2,(152-sh*k)/2,sw*k,sh*k);return c.toDataURL('image/jpeg',.6);
          }
          function bgFor(pg){
            if(!pg.bg)return null;const e=BG.get(pg.bg);
            if(e)return e.complete&&e.naturalWidth?e:null;
            const im=new Image();BG.set(pg.bg,im);im.onload=redraw;idbGet(pg.bg).then(d=>{if(d)im.src=d});return null;
          }
          function redraw(){cancelAnimationFrame(redraw.r);redraw.r=requestAnimationFrame(()=>{if(!cur)return;cv.forEach((_,i)=>rp(i));strip()})}
          function ensureBg(pg){return new Promise(res=>{
            if(!pg.bg)return res();const ok=()=>{const e=BG.get(pg.bg);return e&&e.complete&&e.naturalWidth};
            bgFor(pg);if(ok())return res();const t=setInterval(()=>{if(ok()){clearInterval(t);res()}},50);setTimeout(()=>{clearInterval(t);res()},6000)})}
          async function imgToBg(f){
            const url=URL.createObjectURL(f);
            const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
            const k=Math.min(1,1600/im.naturalWidth,2262/im.naturalHeight),c=document.createElement('canvas');
            c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
            const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
            const id=uid();await idbPut(id,c.toDataURL('image/jpeg',.88));await idbPut(id+':t',thumbData(c));return id;
          }
          const loadScript=src=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.append(e)});
          async function getPdfjs(){
            if(window.pdfjsLib)return window.pdfjsLib;
            for(const base of ['pdfjs/','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/']){
              try{await loadScript(base+'pdf.min.js');if(!window.pdfjsLib)continue;window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';return window.pdfjsLib}catch(e){}
            }
            throw new Error('pdfjs');
          }
          async function pdfToIds(f){
            const lib=await getPdfjs(),doc=await lib.getDocument({data:await f.arrayBuffer()}).promise,ids=[],N=Math.min(doc.numPages,300);
            for(let n=1;n<=N;n++){
              toast('جارٍ استيراد الصفحة '+n+' من '+N);
              const pg=await doc.getPage(n),v0=pg.getViewport({scale:1}),sc=Math.min(1600/v0.width,2262/v0.height),v=pg.getViewport({scale:sc});
              const c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);
              const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
              await pg.render({canvasContext:x,viewport:v,canvas:c}).promise;
              const id=uid();await idbPut(id,c.toDataURL('image/jpeg',.85));await idbPut(id+':t',thumbData(c));ids.push(id);c.width=c.height=1;
            }
            return ids;
          }
          let imMode='';
          $('#pgs').onclick=()=>{const st=$('#st');st.hidden=!st.hidden;if(!st.hidden)strip();$('#ed').classList.toggle('sp',!st.hidden);$('#pgs').classList.toggle('on',!st.hidden);rq()};
          $('#imp').onclick=()=>{deselect();$('#im').hidden=false};
          $('#imx').onclick=()=>$('#im').hidden=true;
          $('#fab2').onclick=()=>{imMode='newpdf';$('#fpdf').click()};
          document.querySelectorAll('#im [data-m]').forEach(b=>b.onclick=()=>{
            const m=b.dataset.m;
            if(m==='rm1'||m==='rma'){const ps=m==='rm1'?[cur.pages[ap]]:cur.pages,old=new Set(ps.map(p=>p.bg).filter(Boolean));
              ps.forEach(p=>delete p.bg);old.forEach(gcBg);save();redraw();$('#im').hidden=true;toast('تمت إزالة الخلفية');return}
            imMode=m;$(m==='pdf'?'#fpdf':'#fimg').click();
          });
          $('#fimg').onchange=async e=>{
            const f=e.target.files[0];e.target.value='';if(!f)return;$('#im').hidden=true;
            try{const id=await imgToBg(f),ps=imMode==='all'?cur.pages:[cur.pages[ap]],old=new Set(ps.map(p=>p.bg).filter(Boolean));
              ps.forEach(p=>p.bg=id);old.forEach(gcBg);save();redraw();toast(imMode==='all'?'تم تعيين الخلفية لكل الصفحات':'تم تعيين خلفية الصفحة')}
            catch(er){toast('تعذّر قراءة الصورة')}
          };
          $('#fpdf').onchange=async e=>{
            const f=e.target.files[0];e.target.value='';if(!f)return;$('#im').hidden=true;
            try{
              const ids=await pdfToIds(f);if(!ids.length)throw 0;
              if(imMode==='newpdf'){
                const n={id:uid(),title:f.name.replace(/\.pdf$/i,'').slice(0,40)||'PDF',cv:COVERS[Math.floor(Math.random()*COVERS.length)],tpl:'blank',pages:ids.map(id=>({strokes:[],bg:id})),u:Date.now()};
                S.notes.push(n);save(n);openNote(n.id);
              }else{
                if(cur.pages.length===1&&!cur.pages[0].strokes.length&&!cur.pages[0].bg)cur.pages=[];
                const first=cur.pages.length;ids.forEach(id=>cur.pages.push({strokes:[],bg:id}));
                buildPages();ap=first;save();redraw();
              }
              toast('تم استيراد '+ids.length+' صفحة');
            }catch(er){toast('تعذّر استيراد الملف. تأكد من الاتصال بالإنترنت أو من سلامة الملف')}
          };
          const SC=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Shortcut;
          $('#npin').onclick=async()=>{
            const p=SC();if(!p){toast('الاختصار متاح في تطبيق الأندرويد فقط');return}
            try{await p.pin({id:cur.id,title:$('#nt').value.trim()||cur.title,color:ncv});toast('أكّد الإضافة في نافذة النظام')}
            catch(e){toast('هاتفك لا يدعم اختصارات الشاشة الرئيسية')}
          };
          function openById(id){
            if(!S.notes.some(n=>n.id===id)){toast('هذه الملاحظة لم تعد موجودة');return}
            deselect();$('#nd').hidden=true;$('#pp').hidden=true;openNote(id);setTool('pen');
          }
          window.addEventListener('najmaOpen',e=>e.id&&ready.then(()=>openById(e.id)));
          const ready=initStore().then(home);
          {const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
          const goBack=()=>{
            const o=['#gp','#im','#nd'].map(x=>$(x)).find(x=>x&&!x.hidden);
            if(o){o.hidden=true;return}
            if(!$('#pp').hidden){$('#pp').hidden=true;return}
            if(cur){deselect();save();flush();home();return}
            if(A&&A.exitApp)A.exitApp();
          };
          if(A&&A.addListener)A.addListener('backButton',goBack);}
          {const p=SC();if(p)p.getLaunch().then(r=>r&&r.id&&ready.then(()=>openById(r.id))).catch(()=>{})}
          $('#pages').addEventListener('scroll',()=>{rq();if(cur&&cv.length){const p=curPage();if(p!==ap){ap=p;pnUpd();actv()}}});window.addEventListener('resize',rq);window.addEventListener('resize',reveal);if(window.visualViewport)visualViewport.addEventListener('resize',reveal);
          </script>
          </body>
          </html>
          NAJMA_EOF

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6
          npx cap init "نجمة" com.najma.notes --web-dir=www
          npx cap add android
          npm install pdfjs-dist@3.11.174 --omit=optional
          mkdir -p www/pdfjs
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/pdfjs/
          npx cap sync android

      - name: Add home-screen shortcut plugin
        run: |
          D=android/app/src/main/java/com/najma/notes
          mkdir -p "$D"
          cat > "$D/ShortcutPlugin.java" <<'JAVA_EOF'
          package com.najma.notes;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ShortcutInfo;
          import android.content.pm.ShortcutManager;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.drawable.Icon;
          import android.os.Build;
          import android.text.Layout;
          import android.text.StaticLayout;
          import android.text.TextPaint;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Shortcut")
          public class ShortcutPlugin extends Plugin {
            @PluginMethod
            public void pin(PluginCall call) {
              String id = call.getString("id", "");
              String title = call.getString("title", "Note").trim();
              if (title.isEmpty()) title = "Note";
              int color;
              try { color = Color.parseColor(call.getString("color", "#3b5bdb")); } catch (Exception e) { color = Color.parseColor("#3b5bdb"); }
              if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) { call.reject("unsupported"); return; }
              Context c = getContext();
              ShortcutManager m = c.getSystemService(ShortcutManager.class);
              if (m == null || !m.isRequestPinShortcutSupported()) { call.reject("unsupported"); return; }
              Intent i = new Intent(c, MainActivity.class);
              i.setAction(Intent.ACTION_VIEW);
              i.putExtra("najmaNote", id);
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
              Bitmap b = Bitmap.createBitmap(192, 192, Bitmap.Config.ARGB_8888);
              Canvas cv = new Canvas(b);
              Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              p.setColor(color);
              cv.drawRoundRect(new RectF(0, 0, 192, 192), 44, 44, p);
              TextPaint tp = new TextPaint(Paint.ANTI_ALIAS_FLAG);
              tp.setColor(Color.WHITE);
              tp.setFakeBoldText(true);
              StaticLayout sl = null;
              for (float sz = 60; sz >= 16; sz -= 4) {
                tp.setTextSize(sz);
                sl = StaticLayout.Builder.obtain(title, 0, title.length(), tp, 160)
                  .setAlignment(Layout.Alignment.ALIGN_CENTER).build();
                if (sl.getHeight() <= 164) break;
              }
              cv.save();
              cv.translate(16, (192 - sl.getHeight()) / 2f);
              sl.draw(cv);
              cv.restore();
              ShortcutInfo s = new ShortcutInfo.Builder(c, "note-" + id)
                .setShortLabel(title).setLongLabel(title)
                .setIcon(Icon.createWithBitmap(b)).setIntent(i).build();
              m.requestPinShortcut(s, null);
              call.resolve();
            }

            @PluginMethod
            public void getLaunch(PluginCall call) {
              Intent i = getActivity().getIntent();
              JSObject r = new JSObject();
              String id = i == null ? null : i.getStringExtra("najmaNote");
              if (id != null) { r.put("id", id); i.removeExtra("najmaNote"); }
              call.resolve(r);
            }
          }
          JAVA_EOF
          cat > "$D/MainActivity.java" <<'JAVA_EOF'
          package com.najma.notes;

          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(ShortcutPlugin.class);
              super.onCreate(savedInstanceState);
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
              String id = intent.getStringExtra("najmaNote");
              if (id != null) {
                intent.removeExtra("najmaNote");
                getBridge().triggerWindowJSEvent("najmaOpen", "{\"id\":\"" + id + "\"}");
              }
            }
          }
          JAVA_EOF

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: najma-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Najma v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
