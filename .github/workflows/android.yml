name: StarNote Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (without cache)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm install --no-optional --no-audit --no-fund

      - name: Build Next.js app
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Setup Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android

      - name: Create Capacitor config
        run: |
          echo '{
            "appId": "com.starnote.app",
            "appName": "StarNote",
            "webDir": ".next"
          }' > capacitor.config.json

      - name: Init Capacitor
        run: npx cap init --web-dir .next || true

      - name: Add Android platform
