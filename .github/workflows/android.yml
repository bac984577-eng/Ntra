name: Build Najma APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Write app (index.html)
        run: |
          mkdir -p www
          cat > www/index.html <<'NAJMA_EOF'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
          <title>نجمة - دفتر ملاحظات بخط اليد</title>
          <style>
          :root{--bg:#f7f5f2;--sf:#ffffff;--tx:#1f2430;--mu:#7b8294;--ac:#2f6bff;--ln:#e6e2dc;--rd:#e5484d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
          html{scroll-padding-top:env(safe-area-inset-top,0px)}
          *{box-sizing:border-box}
          html,body{height:100%;margin:0}
          body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Noto Sans Arabic",sans-serif;overscroll-behavior:none}
          [hidden]{display:none!important}
          button,select,input,textarea{font:inherit;color:inherit}
          button,select{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:6px 10px;cursor:pointer}
          button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--ac);outline-offset:2px}
          button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
          button.warn{background:var(--rd);color:#fff;border-color:var(--rd)}
          svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
          .ib{display:grid;place-items:center;width:40px;height:40px;padding:0}
          #home{height:100%;overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) 18px 120px;background:linear-gradient(180deg,#fffdfa 0,#f7f5f2 260px)}
          .wrap{max-width:760px;margin:0 auto}
          .hd{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 18px}
          .hd small{display:block;color:var(--mu);font-size:14px;margin-bottom:2px}
          h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.3px;font-family:"Amiri","Noto Naskh Arabic","Noto Sans Arabic",serif}
          .logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#5b8cff,#2f6bff 55%,#1d4ed8);box-shadow:0 8px 18px -6px #2f6bff99}
          .logo svg{width:24px;height:24px;fill:#fff;stroke:#fff}
          .srch{position:relative;display:block;margin:0 0 22px}
          .srch svg{position:absolute;inset-inline-start:14px;top:50%;margin-top:-10px;width:20px;height:20px;color:var(--mu)}
          .srch input{width:100%;height:46px;border:1px solid var(--ln);border-radius:16px;background:#fff;padding:0 14px;padding-inline-start:44px;box-shadow:0 2px 8px #1f24300d}
          .sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 12px;font-weight:700;font-size:16px}
          .sec small{color:var(--mu);font-weight:400;font-size:13px}
          #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:22px 14px}
          .card2{display:flex;flex-direction:column;gap:7px;min-width:0;padding:0;border:0;background:none;text-align:start;color:var(--tx);border-radius:12px;-webkit-tap-highlight-color:transparent}
          .cth{position:relative;display:block;aspect-ratio:210/297;border-radius:9px 3px 3px 9px;overflow:hidden;background:#e9e4da;box-shadow:0 14px 20px -12px rgba(20,25,40,.55),0 2px 5px rgba(20,25,40,.14);transition:transform .18s,box-shadow .18s}
          .cth canvas{display:block;width:100%;height:100%}
          .cth::before{content:"";position:absolute;inset-block:3px;inset-inline-end:0;width:2px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.55) 0 1px,rgba(0,0,0,.08) 1px 2px);opacity:.7;pointer-events:none}
          .cth::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,0) 40%,rgba(0,0,0,.14)),linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,0) 90%,rgba(255,255,255,.1));box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
          .card2:hover .cth{transform:translateY(-3px);box-shadow:0 18px 24px -12px rgba(20,25,40,.6),0 2px 6px rgba(20,25,40,.16)}
          .card2:active .cth{transform:scale(.96)}
          .cn{font-weight:700;font-size:13px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;padding-inline:2px}
          .cm{font-size:11px;color:var(--mu);padding-inline:2px;margin-top:-4px}
          .card{--c:#3b5bdb;position:relative;aspect-ratio:3/4.1;padding:16px 14px 14px;padding-inline-start:24px;border:0;border-radius:8px 20px 20px 8px;background:var(--c);color:#fff;text-align:start;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 14px 24px -10px var(--sh,#0004),0 2px 6px #1f243014;overflow:hidden;transition:transform .15s}
          .card:active{transform:scale(.97)}
          .card::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:13px;background:linear-gradient(90deg,#0003,#ffffff33 55%,#0000)}
          .card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(155deg,#ffffff47,#ffffff00 42%,#00000029)}
          .card>*{position:relative;z-index:1}
          .card .bd{width:30px;height:30px;border-radius:10px;background:#ffffff2e;display:grid;place-items:center}
          .card .bd svg{width:16px;height:16px;fill:#fff;stroke:#fff}
          .card b{font-weight:700;font-size:17px;line-height:1.35;overflow-wrap:anywhere;display:block}
          .card small{opacity:.88;font-size:12px;display:block;margin-top:6px}
          .empty{text-align:center;color:var(--mu);padding:48px 12px;grid-column:1/-1}
          .empty svg{width:64px;height:64px;margin:0 auto 12px;color:#c9c3b8;fill:#e9e4da}
          .fab{position:fixed;inset-inline-end:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));height:54px;padding:0 22px;border:0;border-radius:27px;display:flex;align-items:center;gap:8px;background:linear-gradient(145deg,#4f82ff,#2f6bff);color:#fff;font-weight:700;box-shadow:0 14px 26px -8px #2f6bffaa}
          .fab2{position:fixed;inset-inline-start:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:#fff;color:#2f6bff;box-shadow:0 10px 22px -8px #1f243044}
          .imb{display:flex;gap:10px;align-items:center;justify-content:flex-start;width:100%;padding:12px}
          .fi{position:fixed;left:-99px;top:0;width:1px;height:1px;opacity:0}
          #ed{position:relative;height:100%;display:flex;flex-direction:column}
          .top{display:flex;gap:0;align-items:center;padding:6px 8px;background:var(--sf);border-bottom:1px solid var(--ln)}
          .top .ib{width:31px;height:34px;background:none;border:0;border-radius:8px;color:var(--tx)}
          .top .ib:disabled{opacity:.3}
          .sep{width:1px;height:26px;background:var(--ln);margin-inline:4px}
          #ttl{flex:1;min-width:50px;border:0;background:transparent;font-weight:700;font-size:17px}
          #zl{min-width:46px;height:30px;padding:0 4px;border:0;background:none;text-align:center;font-size:13px;font-weight:700;color:var(--ac)}
          #zb{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:9;background:#1f2430e6;color:#fff;border-radius:14px;padding:6px 16px;font-weight:700;font-size:16px;pointer-events:none}
          #zm{position:absolute;top:46px;left:50%;transform:translateX(-50%);z-index:9;width:min(260px,calc(100% - 24px));background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:10px;box-shadow:0 12px 32px #1f243040;display:flex;flex-direction:column;gap:6px}
          #zm button{display:flex;align-items:center;gap:8px;justify-content:flex-start;padding:7px 10px}
          #zm .zr{display:flex;gap:6px;align-items:center}
          #zm .zr>button:first-child{flex:1}
          #zm .zr .ib{width:34px;height:34px;justify-content:center;flex:none}
          #zm svg{width:18px;height:18px}
          #zm .zr svg,#zm .zadd.on svg{fill:#f59f00;stroke:#f59f00}
          #zm .zr .ib svg{fill:none;stroke:currentColor}
          #cloud{color:#2ecc71}
          #mid{flex:1;min-height:0;display:flex;direction:rtl}
          #work{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:10px minmax(0,1fr);grid-template-rows:10px minmax(0,1fr);direction:ltr}
          #rh{grid-column:2;grid-row:1;width:100%;height:10px;display:block}
          #rv{grid-column:1;grid-row:2;width:10px;height:100%;display:block}
          #ed.sp #pages{padding-bottom:130px}
          #gd{grid-column:2;grid-row:2;position:relative;z-index:4;width:100%;height:100%;pointer-events:none}
          #pages{grid-column:2;grid-row:2;min-height:0;overflow:auto;padding:14px 14px 24px;display:flex;flex-direction:column;gap:22px;background:#ebe8e3}
          .pw{position:relative;flex:none;margin:0 auto;box-shadow:0 2px 4px #0000000d,0 8px 24px #0000001f;border-radius:2px}
          .pg{display:block;width:100%;aspect-ratio:210/297;height:auto;background:#fff;border-radius:2px;touch-action:none}
          .hand .pg{touch-action:none}
          .pl{position:absolute;top:100%;left:0;right:0;margin-top:3px;text-align:center;font-size:11px;color:var(--mu);pointer-events:none}
          #pn{position:absolute;left:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:2px;direction:ltr;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:4px;box-shadow:0 8px 24px #1f243033}
          #ed.sp #pn{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
          #pn button{height:34px;min-width:34px;padding:0 4px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--tx)}
          #pn svg{width:20px;height:20px}
          #pn #pnt{min-width:58px;font-size:14px}
          #pn button.warn{background:var(--rd);color:#fff}
          .tb{position:absolute;border:1.5px dashed #1c7ed6;touch-action:none;cursor:move;z-index:3}
          .tb.ed{border-style:solid;cursor:text;background:#1c7ed60d;box-shadow:0 0 0 4px #1c7ed626}
          .tb textarea{display:block;width:100%;height:100%;margin:0;padding:0;border:0;background:transparent;resize:none;overflow:hidden;line-height:1.3;caret-color:transparent;outline:0;pointer-events:none}
          .tb.ed textarea{pointer-events:auto}
          .rl,.rr{position:absolute;top:50%;width:5px;height:14px;margin-top:-7px;border-radius:3px;background:#1c7ed6;border:1px solid #fff;cursor:ew-resize;touch-action:none}
          .rl{left:-3px}.rr{right:-3px}
          .rs{position:absolute;right:-4px;bottom:-4px;width:8px;height:8px;border-radius:50%;background:#1c7ed6;border:1px solid #fff;cursor:nwse-resize;touch-action:none}
          .rl::before,.rr::before,.rs::before{content:"";position:absolute;inset:-14px}
          .cr{position:absolute;width:2.5px;margin-left:-1.25px;background:#1c7ed6;border-radius:1px;pointer-events:none;z-index:4;animation:bl .9s steps(1) infinite}
          @keyframes bl{50%{opacity:0}}
          .ch{position:absolute;width:44px;height:40px;margin-left:-22px;z-index:5;touch-action:none;-webkit-tap-highlight-color:transparent}
          .ch::before{content:"";position:absolute;left:14px;top:3px;width:16px;height:16px;background:#1c7ed6;border-radius:0 50% 50% 50%;transform:rotate(45deg)}
          .nol{position:absolute;border:2px dashed #1c7ed6;pointer-events:none;z-index:3}
          .nbar{position:absolute;z-index:6;display:flex;gap:3px;padding:3px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;box-shadow:0 6px 18px #1f243040}
          .nbar button{width:32px;height:32px;padding:0;border:0;background:none;display:grid;place-items:center;border-radius:9px;color:var(--tx)}
          .nbar button.rd{color:var(--rd)}
          .nbar svg{width:18px;height:18px}
          #tl{flex:none;width:24px;z-index:6;background:var(--sf);border-left:1px solid var(--ln);padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:1px;overflow-y:auto}
          #tl .ib{width:21px;height:24px;border:0;background:none;color:var(--mu);border-radius:10px;flex:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
          #tl .ib svg{width:15px;height:15px}
          #tl .ib.on{background:var(--ac);color:#fff}
          #cc{width:16px;height:16px;border-radius:50%;border:2px solid var(--mu);margin:5px auto 2px;padding:0;flex:none}
          #tl #addp{margin-top:auto;border:1px dashed #cfc9bf;color:var(--ac);background:var(--sf)}
          #pp{position:absolute;right:46px;top:60px;width:min(310px,calc(100% - 58px));z-index:7;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px;box-shadow:0 12px 32px #1f243040;display:flex;flex-direction:column;gap:10px}
          .pr{display:flex;align-items:center;gap:10px}
          .pr input[type=range]{flex:1;accent-color:var(--ac)}
          .nm{min-width:4ch;text-align:center;color:var(--mu);font-size:13px}
          .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
          .dot{position:relative;width:28px;height:28px;border-radius:50%;padding:0;border:2px solid var(--ln);display:grid;place-items:center;cursor:pointer}
          .cg .dot{width:100%;height:auto;aspect-ratio:1}
          .dot svg{width:16px;height:16px;color:#fff}
          .dot.sel{outline:2px solid var(--ac);outline-offset:2px}
          .dot input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
          #pv{width:100%;height:54px;border-radius:10px;background:#fff}
          #st{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:8px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:8px;max-width:calc(100% - 16px);overflow-x:auto;box-shadow:0 8px 24px #1f243033}
          .th{position:relative;width:54px;height:76px;padding:0;border-radius:8px;border:2px solid var(--ln);overflow:hidden;background:#fff;flex:none}
          .th.on{border-color:var(--ac)}
          .th canvas{width:100%;height:100%;display:block}
          .th i{position:absolute;bottom:3px;right:3px;font-style:normal;font-size:11px;background:#555c;color:#fff;border-radius:5px;padding:0 5px}
          .th.add{border-style:dashed;background:none;color:var(--mu);display:grid;place-items:center}
          .ov{position:fixed;inset:0;background:#1f243073;display:grid;place-items:center;padding:16px;z-index:8}
          .sheet{background:#fffdfa;border-radius:22px;padding:18px;box-shadow:0 12px 32px #1f243040;max-height:92vh;overflow-y:auto;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
          .sheet input[type=text],.sheet select{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
          .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
          .cvs{display:flex;gap:10px;flex-wrap:wrap}
          .cvs .dot{width:34px;height:34px}
          .ndt{font-size:20px;font-weight:800;font-family:"Amiri","Noto Naskh Arabic","Noto Sans Arabic",serif}
          .lb{color:var(--mu);font-size:12px;font-weight:600;margin-top:2px}
          .tpls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
          .tp{position:relative;padding:6px 6px 8px;border:2px solid var(--ln);border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s}
          .tp:active{transform:scale(.96)}
          .tp canvas{width:100%;height:auto;display:block;border-radius:8px;border:1px solid #eee9e2}
          .tp span{font-size:13px}
          .tp.sel{border-color:var(--ac);box-shadow:0 8px 18px -8px #2f6bff88}
          .tp.sel span{font-weight:700}
          .tp .ck{position:absolute;top:-7px;inset-inline-end:-7px;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center}
          .tp .ck svg{width:12px;height:12px;stroke-width:3}
          .sheet>*{flex:none}
          .bds{grid-template-columns:repeat(5,1fr);gap:8px}
          .bds .tp{padding:4px 4px 6px;border-radius:11px;gap:4px}
          .bds .tp span{font-size:11px}
          .bds .tp .ck{width:17px;height:17px;top:-6px}
          .mrow{display:flex;gap:14px;align-items:center;justify-content:space-between}
          .mc{flex:1;display:flex;flex-direction:column;gap:8px}
          .mc input{width:64px;text-align:center;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:6px}
          #nbp{width:104px;height:auto;flex:none;border:1px solid var(--ln);border-radius:3px;box-shadow:0 4px 10px #1f243022;background:#fff}
          #nscope button{flex:1}
          .tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 22px}
          .tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:16px;border:1px solid var(--ln);background:#fff;font-size:11px;line-height:1.3;text-align:center;color:var(--tx);box-shadow:0 2px 8px #1f24300d}
          .tile svg{width:24px;height:24px;color:var(--ac)}
          .card b,.card small{text-shadow:0 1px 3px #0008}
          .fld{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
          .svs{max-width:560px;height:min(92vh,780px);justify-content:flex-start}
          .svh{display:flex;align-items:center;gap:8px}
          #svb{display:flex;flex-direction:column;gap:12px}
          #svb>*{flex:none}
          .bigt{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
          .bar{height:8px;background:#ece8e1;border-radius:6px;overflow:hidden}
          .bar i{display:block;height:100%;width:0;background:var(--ac)}
          .chk{display:flex;gap:8px;align-items:center;font-size:14px}
          .dbars{display:flex;gap:8px;align-items:flex-end;height:96px}
          .dbars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:10px;color:var(--mu)}
          .dbars i{display:block;width:100%;background:var(--ac);border-radius:6px 6px 0 0}
          .it{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--ln);border-radius:14px;background:#fff}
          .it small{display:block;color:var(--mu);font-size:12px}
          .it .ib{width:34px;height:34px;border:0;background:none;color:var(--mu);flex:none}
          .pill{color:#fff;border-radius:10px;padding:2px 8px;font-size:12px;white-space:nowrap}
          .fcard{min-height:180px;border-radius:18px;border:1px solid var(--ln);background:#fff;display:grid;place-items:center;padding:18px;text-align:center;font-size:20px;white-space:pre-wrap;width:100%}
          .gr4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
          .ecur{position:absolute;pointer-events:none;z-index:3;border:1.5px solid #e5484d;background:#e5484d22;box-sizing:border-box;min-width:3px;min-height:3px}
          .ecur.ci{border-radius:50%}
          .alr button.erb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:auto;padding:8px 4px;font-size:11px;line-height:1.3}
          .erb svg{width:22px;height:22px}
          .alr{display:flex;gap:6px}
          .alr button{flex:1;height:36px;display:grid;place-items:center;padding:0}
          .alr svg{width:18px;height:18px}
          #toast{position:fixed;inset-inline:16px;bottom:130px;margin:auto;max-width:360px;background:#1f2430;color:#fff;border-radius:10px;padding:10px 14px;text-align:center;z-index:9}
          /* ===== تحسينات: المسطرة + التحديد + النوافذ الموحدة ===== */
          :root{--rw:20px;--r:12px;--sel:rgba(34,197,94,.30);--bd:#d9d4cb;--ac-soft:#2f6bff1a;--elev:0 10px 30px -8px rgba(15,20,35,.28),0 1px 3px rgba(15,20,35,.08)}
          ::selection{background:var(--sel)}
          .tb textarea::selection,input::selection,textarea::selection{background:var(--sel)}
          input,textarea{caret-color:var(--ac)}
          #work{grid-template-columns:var(--rw) minmax(0,1fr);grid-template-rows:var(--rw) minmax(0,1fr)}
          #work::before{content:"";grid-column:1;grid-row:1;background:#e3dfd8;border-bottom:1px solid #c9c4ba;border-right:1px solid #c9c4ba}
          #rh{height:var(--rw)}
          #rv{width:var(--rw)}
          .ov{background:rgba(17,22,36,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:ovIn .18s ease}
          @keyframes ovIn{from{opacity:0}}
          @keyframes shIn{from{opacity:0;transform:translateY(10px) scale(.98)}}
          .sheet{background:var(--sf);border:1px solid rgba(20,25,40,.06);border-radius:20px;padding:20px;gap:14px;box-shadow:0 24px 60px -16px rgba(15,20,35,.45),0 2px 8px rgba(15,20,35,.08);animation:shIn .2s cubic-bezier(.2,.8,.2,1)}
          .sheet>.ndt,.svh{padding-bottom:12px;border-bottom:1px solid var(--ln)}
          .ndt{font-size:19px;line-height:1.3}
          .lb{font-size:12.5px;font-weight:700;color:var(--mu);margin:4px 0 -4px}
          .sheet input[type=text],.sheet input[type=number],.sheet input[type=search],.sheet select,.fld,.mc input{width:100%;height:42px;padding:0 12px;background:#fff;border:1px solid var(--bd);border-radius:var(--r);font-size:15px;transition:border-color .15s,box-shadow .15s}
          textarea.fld{height:auto;padding:10px 12px;line-height:1.5}
          .mc input{width:72px}
          .sheet input:focus,.fld:focus,.sheet select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
          .sheet button:not(.ib):not(.dot):not(.tp){min-height:42px;padding:0 14px;border:1px solid var(--bd);border-radius:var(--r);background:#fff;font-size:14px;font-weight:600;transition:background .15s,transform .1s}
          .sheet button:not(.dot):not(.tp):hover{background:#f6f3ee}
          .sheet button:not(.dot):not(.tp):active{transform:scale(.97)}
          .sheet button.on:not(.dot):not(.tp),.sheet button.on:not(.dot):not(.tp):hover{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 6px 14px -6px #2f6bff99}
          .sheet .ib{width:42px;height:42px;border:1px solid var(--bd);border-radius:var(--r);background:#fff}
          .sheet .row .ib{width:auto;min-width:46px;height:44px;padding:0 16px}
          .sheet .svh .ib{width:38px;height:38px;border:0;background:var(--bg)}
          .sheet .imb{height:auto;min-height:48px;padding:0 14px;font-weight:600}
          .sheet>.row:last-child{padding-top:14px;border-top:1px solid var(--ln);justify-content:flex-end;gap:10px}
          #ndel{margin-inline-end:auto;color:var(--rd);background:#fff5f5;border-color:#f3c9cb}
          #nscope,#ncfw{display:flex;gap:2px;padding:3px;background:#efebe4;border-radius:14px;border:0}
          #nscope button,#ncfw button{flex:1;min-height:36px;border:0;background:transparent;border-radius:11px;box-shadow:none}
          .sheet #nscope button.on,.sheet #ncfw button.on{background:#fff;color:var(--ac);box-shadow:0 1px 4px rgba(20,25,40,.18)}
          .sheet #nscope button:hover,.sheet #ncfw button:hover{background:transparent}
          .sheet #nscope button.on:hover,.sheet #ncfw button.on:hover{background:#fff}
          .pr .ib,#nbup,#nbdn{width:42px;height:42px}
          .chk{gap:10px;font-size:14px;min-height:34px}
          .chk input,.sheet input[type=checkbox]{width:19px;height:19px;accent-color:var(--ac);flex:none;margin:0}
          .dot{border:2px solid #fff;box-shadow:0 0 0 1px var(--bd)}
          .dot.sel{outline:0;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ac)}
          .tp{border:1.5px solid var(--ln);border-radius:14px}
          .tp.sel{border-color:var(--ac);background:#f3f7ff}
          .cvs{gap:10px}
          .sheet .alr button{height:auto}
          #zm,#pp{border:1px solid rgba(20,25,40,.07);border-radius:16px;padding:12px;box-shadow:var(--elev)}
          #pn,#st{border:1px solid rgba(20,25,40,.07);border-radius:16px;box-shadow:var(--elev)}
          .nbar{border:1px solid rgba(20,25,40,.07);box-shadow:var(--elev)}
          #zm button:not(.ib){min-height:38px;border-radius:10px;font-size:14px;font-weight:600;border:1px solid var(--bd)}
          #pp select,#pp input[type=text],#pp input[type=number]{height:38px;border:1px solid var(--bd);border-radius:10px;padding:0 10px}
          /* ===== أداة خطوط كورنيل ===== */
          #cnp{position:absolute;inset-inline:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:520px;z-index:7;background:var(--sf);border:1px solid rgba(20,25,40,.07);border-radius:20px;box-shadow:var(--elev);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;animation:shIn .2s cubic-bezier(.2,.8,.2,1)}
          #cnp>*{flex:none}
          #ed.cnon #pages{padding-bottom:min(62vh,430px)}
          #ed.cnon #pn,#ed.cnon #st{display:none}
          .cnh{display:flex;align-items:center;gap:8px}
          .cnh b{font-size:16px;font-weight:800}
          .cnh small{color:var(--mu);font-size:12px;font-weight:600;background:var(--bg);border-radius:8px;padding:2px 8px}
          .cnb{display:flex;gap:12px;align-items:stretch}
          #cnpv{width:84px;height:119px;flex:none;border:1px solid var(--bd);border-radius:6px;box-shadow:0 4px 10px #1f243022;background:#fff;touch-action:none;cursor:grab}
          .cnc{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
          .cnl{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border:1px solid var(--ln);border-radius:14px;background:#fff}
          .cnl.off{background:#faf8f5}
          .cnl.off .cnr span,.cnl.off .stp{opacity:.45}
          .cnr{display:flex;align-items:center;gap:8px}
          .cnr span{font-weight:700;font-size:13.5px;flex:1;min-width:0;line-height:1.25}
          .cnr span small{display:block;font-weight:500;font-size:11px;color:var(--mu)}
          .stp{display:flex;align-items:center;gap:2px;direction:ltr}
          .stp button{width:28px;height:28px;border-radius:9px;border:1px solid var(--bd);background:#fff;padding:0;font-size:17px;line-height:1;font-weight:700;display:grid;place-items:center;touch-action:manipulation}
          .stp button:disabled{opacity:.4}
          .stp input{width:46px;height:28px;text-align:center;border:1px solid var(--bd);border-radius:9px;padding:0;font-size:13px;font-weight:700;background:#fff;-moz-appearance:textfield}
          .stp input::-webkit-inner-spin-button,.stp input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
          .stp em{font-style:normal;font-size:11px;color:var(--mu);margin-inline-start:3px}
          .cnl input[type=range]{width:100%;accent-color:#16a34a;margin:0;height:22px}
          .sw{position:relative;width:36px;height:22px;flex:none;display:block}
          .sw input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer;z-index:1}
          .sw i{position:absolute;inset:0;border-radius:11px;background:#d5d0c6;transition:background .15s}
          .sw i::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .15s}
          .sw input:checked+i{background:#16a34a}
          .sw input:checked+i::after{transform:translateX(-14px)}
          .sw input:focus-visible+i{outline:2px solid var(--ac);outline-offset:2px}
          .seg{display:flex;gap:2px;padding:3px;background:#efebe4;border-radius:12px}
          .seg button{flex:1;min-height:34px;border:0;background:transparent;border-radius:9px;font-size:13px;font-weight:600;padding:0 8px;white-space:nowrap}
          .seg button.on{background:#fff;color:var(--ac);box-shadow:0 1px 4px rgba(20,25,40,.18)}
          .chp{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
          .chp button{flex:none;min-height:34px;padding:0 13px;border-radius:17px;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--bd)}
          .chp button:active{background:var(--ac-soft)}
          .cna{border:1px solid var(--ln);border-radius:14px;padding:0 12px;background:#fff}
          .cna summary{min-height:40px;display:flex;align-items:center;font-weight:700;font-size:13.5px;cursor:pointer;list-style:none}
          .cna summary::-webkit-details-marker{display:none}
          .cna summary::after{content:"";margin-inline-start:auto;width:8px;height:8px;border-inline-end:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);transition:transform .15s}
          .cna[open] summary::after{transform:rotate(-135deg)}
          .cnx2{display:flex;flex-direction:column;gap:8px;padding:0 0 12px}
          .cnx2 .lb{margin:2px 0 -2px}
          .cnf{display:flex;gap:8px;align-items:center}
          .cnf .seg{flex:1}
          .cnf .ib{width:auto;min-width:46px;height:42px;padding:0 14px;border:1px solid var(--bd);border-radius:12px;background:#fff}
          .cnf .ib.on{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 6px 14px -6px #2f6bff99}
          </style>
          </head>
          <body>
          <main id="home">
            <div class="wrap">
              <div class="hd"><div><small id="hi">أهلًا</small><h1>دفاتري</h1></div><div class="logo" data-i="star"></div></div>
              <label class="srch"><span data-i="search"></span><input id="sq" type="search" aria-label="بحث في الدفاتر" placeholder="ابحث في دفاترك"></label>
              <div class="tools" id="tools"></div>
              <div class="sec"><span>كل الدفاتر</span><small id="cnt"></small></div>
              <div id="grid"></div>
            </div>
            <button id="fab" class="fab" aria-label="دفتر جديد" title="دفتر جديد"><span data-i="plus" style="display:grid"></span>دفتر جديد</button>
            <button id="fab2" class="fab2 ib" data-i="fileup" aria-label="استيراد PDF أو صور كدفتر جديد" title="استيراد PDF أو صور كدفتر جديد"></button>
          </main>

          <section id="ed" hidden>
            <div class="top">
              <button id="back" class="ib" data-i="back" aria-label="الدفاتر" title="الدفاتر"></button><span class="sep"></span>
              <input id="ttl" aria-label="عنوان الدفتر">
              <button id="pgs" class="ib" data-i="layers" aria-label="الصفحات" title="عرض الصفحات"></button>
              <button id="imp" class="ib" data-i="image" aria-label="استيراد خلفية أو PDF" title="استيراد خلفية أو PDF"></button>
              <button id="re" class="ib" data-i="re" aria-label="إعادة" title="إعادة"></button>
              <button id="un" class="ib" data-i="un" aria-label="تراجع" title="تراجع"></button>
              <button id="zo" class="ib" data-i="zo" aria-label="تصغير" title="تصغير"></button>
              <button id="zl" aria-label="الأحجام المفضلة" title="الأحجام المفضلة">100%</button>
              <button id="zi" class="ib" data-i="zi" aria-label="تكبير" title="تكبير"></button>
              <button id="cov" class="ib" data-i="layout" aria-label="الغلاف والورق" title="الغلاف والورق"></button>
              <button id="exp" class="ib" data-i="pdf" aria-label="تصدير PDF" title="تصدير PDF"></button>
            </div>
            <div id="mid">
              <div id="tl">
                <button data-t="hand" class="ib" data-i="cursor" aria-label="تحديد" title="تحديد وتمرير"></button>
                <button data-t="pen" class="ib on" data-i="pen" aria-label="قلم" title="قلم"></button>
                <button data-t="hl" class="ib" data-i="hl" aria-label="تمييز" title="تمييز"></button>
                <button data-t="er" class="ib" data-i="er" aria-label="ممحاة" title="ممحاة"></button>
                <button data-t="tx" class="ib" data-i="tx" aria-label="نص" title="نص"></button>
                <button data-t="tr" class="ib" data-i="tree" aria-label="مشجرة" title="مشجرة"></button>
                <button id="cnb" class="ib" data-i="cornell" aria-label="خطوط كورنيل" title="خطوط كورنيل (تقسيم الصفحة)"></button>
                <button id="cc" aria-label="اللون" title="اللون"></button>
                <button id="addp" class="ib" data-i="fileplus" aria-label="إضافة صفحة" title="إضافة صفحة"></button>
              </div>
              <div id="work"><canvas id="rh" aria-hidden="true"></canvas><canvas id="rv" aria-hidden="true"></canvas><div id="pages"></div><canvas id="gd" aria-hidden="true"></canvas></div>
            </div>
            <div id="pn">
              <button id="pnp" data-i="cu" aria-label="الصفحة السابقة" title="الصفحة السابقة"></button>
              <button id="pnt" aria-label="انتقال إلى صفحة" title="انتقال إلى صفحة">1 / 1</button>
              <button id="pnn" data-i="cd" aria-label="الصفحة التالية" title="الصفحة التالية"></button>
              <button id="pnd" data-i="trash" aria-label="حذف الصفحة الحالية" title="حذف الصفحة الحالية"></button>
              <button id="pns" data-i="sliders" aria-label="خصائص الصفحة" title="خصائص الصفحة"></button>
            </div>
            <div id="zb" hidden></div>
            <div id="zm" hidden></div>
            <div id="pp" hidden></div>
            <div id="st" hidden></div>
          <div id="cnp" hidden>
            <div class="cnh"><b>خطوط كورنيل</b><small id="cnt"></small></div>
            <div class="cnb">
              <canvas id="cnpv" width="168" height="238" aria-label="معاينة موضع الخطين — اسحب الخط لتحريكه"></canvas>
              <div class="cnc">
                <div class="cnl" data-k="h">
                  <div class="cnr"><label class="sw"><input type="checkbox" aria-label="تفعيل الخط الأفقي"><i></i></label><span>الخط الأفقي <small>من الأعلى</small></span>
                    <div class="stp"><button type="button" data-d="-1" aria-label="إنقاص">−</button><input type="number" inputmode="decimal" aria-label="المسافة من الأعلى بالسنتيمتر"><button type="button" data-d="1" aria-label="زيادة">+</button><em>سم</em></div></div>
                  <input type="range" aria-label="موضع الخط الأفقي">
                </div>
                <div class="cnl" data-k="v">
                  <div class="cnr"><label class="sw"><input type="checkbox" aria-label="تفعيل الخط العمودي"><i></i></label><span>الخط العمودي <small>من اليمين</small></span>
                    <div class="stp"><button type="button" data-d="-1" aria-label="إنقاص">−</button><input type="number" inputmode="decimal" aria-label="المسافة من اليمين بالسنتيمتر"><button type="button" data-d="1" aria-label="زيادة">+</button><em>سم</em></div></div>
                  <input type="range" aria-label="موضع الخط العمودي">
                </div>
              </div>
            </div>
            <div class="chp" id="cnch"><button type="button" data-pr="cornell">كورنيل عربي</button><button type="button" data-pr="wide">عمود عريض</button><button type="button" data-pr="cue">عمود فقط</button><button type="button" data-pr="head">عنوان فقط</button></div>
            <details class="cna"><summary>اللون والنمط والامتداد</summary><div class="cnx2">
              <div class="lb">اللون</div><div class="cvs" id="cncs" role="group" aria-label="لون الخطوط"></div>
              <div class="lb">السماكة</div><div class="seg" data-o="w"><button type="button" data-v="1.4">رفيع</button><button type="button" data-v="2.2">متوسط</button><button type="button" data-v="3.4">سميك</button></div>
              <div class="lb">النمط</div><div class="seg" data-o="s"><button type="button" data-v="solid">متصل</button><button type="button" data-v="dash">متقطع</button><button type="button" data-v="dot">منقط</button></div>
              <div class="lb">امتداد الخط الأفقي</div><div class="seg" data-o="hx"><button type="button" data-v="main">حتى الخط العمودي</button><button type="button" data-v="full">كامل العرض</button></div>
              <div class="lb">امتداد الخط العمودي</div><div class="seg" data-o="vx"><button type="button" data-v="full">كامل الارتفاع</button><button type="button" data-v="sub">من الخط الأفقي</button></div>
            </div></details>
            <div class="cnf"><div class="seg" id="cnsc"><button type="button" data-s="one">هذه الصفحة</button><button type="button" data-s="all">كل الصفحات</button></div><button id="cnx" type="button" class="ib" data-i="x" aria-label="إلغاء"></button><button id="cnok" type="button" class="ib on" data-i="check" aria-label="تطبيق"></button></div>
          </div>
          </section>

          <div id="nd" class="ov" hidden><div class="sheet">
            <div class="ndt" id="ndt">دفتر جديد</div>
            <div id="nscope" class="row" hidden><button data-s="one" class="on">هذه الصفحة فقط</button><button data-s="all">كل الصفحات</button></div>
            <div id="nmeta" style="display:flex;flex-direction:column;gap:12px">
              <input id="nt" type="text" aria-label="اسم الدفتر" placeholder="اسم الدفتر">
              <div class="lb">لون الغلاف</div>
              <div class="cvs" id="cvs" role="group" aria-label="لون الغلاف"></div>
              <input id="nsub" type="text" aria-label="سطر إضافي" placeholder="سطر إضافي على الغلاف (المادة / الاسم)">
              <div class="lb">تصميم الغلاف</div>
              <div class="tpls" id="cst" style="grid-template-columns:repeat(3,1fr)" role="radiogroup" aria-label="تصميم الغلاف"></div>
              <div class="lb">صورة الغلاف (PNG · JPG · WEBP · GIF · BMP · AVIF · SVG · PDF)</div>
              <div class="row" style="justify-content:flex-start"><button id="ncim" type="button" class="imb" style="width:auto"><span data-i="image" style="display:grid"></span>استيراد صورة غلاف</button><button id="ncrm" type="button" hidden>إزالة الصورة</button></div>
              <div class="lb" id="ncfl" hidden>ملاءمة الصورة مع الغلاف</div>
              <div class="row" id="ncfw" hidden style="justify-content:flex-start"><button type="button" data-f="auto" class="on">تلقائي</button><button type="button" data-f="fill">ملء الغلاف</button><button type="button" data-f="fit">الصورة كاملة</button></div>
              <label class="chk" id="ncwt" hidden><input type="checkbox" id="ncti"> عرض العنوان فوق الصورة</label>
              <label class="chk"><input type="checkbox" id="ncon"> إظهار صفحة الغلاف في أول الدفتر</label>
            </div>
            <div class="lb">نوع الورق</div>
            <input id="ntpl" type="hidden" value="lines">
            <div class="tpls" id="tpls" role="radiogroup" aria-label="نوع الورق"></div>
            <div class="lb">حدود الصفحة</div>
            <input id="nbd" type="hidden" value="none"><input id="nbc" type="hidden" value="#1b2033">
            <div class="tpls bds" id="bds" role="radiogroup" aria-label="نوع الحدود"></div>
            <div class="cvs" id="bcs" role="group" aria-label="لون الحدود"></div>
            <div class="mrow" id="nmr">
              <div class="mc">
                <div class="lb">هامش الحدود عن حافة الورقة (سم)</div>
                <div class="pr"><button id="nbup" type="button" class="ib" aria-label="زيادة">+</button><input id="nbv" type="number" min="0" max="8" step="0.1" inputmode="decimal" aria-label="هامش الحدود بالسنتيمتر"><button id="nbdn" type="button" class="ib" aria-label="إنقاص">−</button></div>
              </div>
              <canvas id="nbp" width="252" height="356" aria-hidden="true"></canvas>
            </div>
            <button id="npin" hidden style="display:flex;gap:8px;align-items:center;justify-content:center"><span data-i="pin" style="display:grid"></span>إضافة اختصار للشاشة الرئيسية</button>
            <div class="row"><button id="ndel" class="ib" data-i="trash" aria-label="حذف الدفتر" title="حذف الدفتر"></button><button id="nx" class="ib" data-i="x" aria-label="إلغاء"></button><button id="nok" class="ib on" data-i="check" aria-label="حفظ"></button></div>
          </div></div>

          <div id="im" class="ov" hidden><div class="sheet">
            <button data-m="one" class="imb"><span data-i="image" style="display:grid"></span>صورة خلفية للصفحة الحالية</button>
            <button data-m="all" class="imb"><span data-i="image" style="display:grid"></span>صورة خلفية لكل الصفحات</button>
            <button data-m="pdf" class="imb"><span data-i="fileup" style="display:grid"></span>إضافة صفحات من ملفات (PDF أو صور)</button>
            <button data-m="rm1" class="imb"><span data-i="trash" style="display:grid"></span>إزالة خلفية الصفحة الحالية</button>
            <button data-m="rma" class="imb"><span data-i="trash" style="display:grid"></span>إزالة خلفية كل الصفحات</button>
            <div class="row"><button id="imx" class="ib" data-i="x" aria-label="إغلاق"></button></div>
          </div></div>
          <input type="file" id="fimg" accept="image/*,.svg,.webp,.avif,.bmp,.gif" class="fi" tabindex="-1" aria-hidden="true">
          <input type="file" id="fpdf" accept="application/pdf,.pdf,image/*,.svg,.webp,.avif,.bmp,.gif" multiple class="fi" tabindex="-1" aria-hidden="true">
          <input type="file" id="fcov" accept="image/*,.svg,.webp,.avif,.bmp,.gif,application/pdf,.pdf" class="fi" tabindex="-1" aria-hidden="true">
